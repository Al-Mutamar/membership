<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استمارة تعارف – حزب المؤتمر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mut:#5b6784;--navy:#1d3a9e;--green:#2e9b4f;--line:#d5dcec;--err:#c0262d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#e8ecf7;--mut:#9aa6c4;--navy:#7d9bff;--green:#5fd083;--line:#2b3658;--err:#ff7b80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#e8ecf7;--mut:#9aa6c4;--navy:#7d9bff;--green:#5fd083;--line:#2b3658;--err:#ff7b80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.7}
header{background:var(--navy);color:#fff;padding:22px 16px 18px;text-align:center;border-bottom:5px solid var(--green)}
header h1{margin:0;font-size:1.6rem;font-weight:800}
header p{margin:2px 0 0;opacity:.9}
main{max-width:760px;margin:0 auto;padding:16px}
.bar{display:flex;gap:4px;margin:6px 0 4px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--green)}
.stepname{color:var(--mut);margin:0 0 12px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{margin:0 0 14px;font-size:1.25rem;color:var(--navy)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px}.full{grid-column:1/-1}
label{font-weight:600;font-size:.93rem}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-height:44px}
input:focus,select:focus,button:focus-visible,canvas:focus-visible{outline:3px solid var(--navy);outline-offset:1px}
input[readonly]{opacity:.75}
.bad{border-color:var(--err)}
.msg{color:var(--err);font-size:.85rem;min-height:0}
.hint{color:var(--mut);font-size:.85rem}
.yn{display:flex;gap:8px}
.yn label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-weight:400}
.yn input{width:auto;min-height:0}
.yn label:has(input:checked){border-color:var(--green);background:color-mix(in srgb,var(--green) 15%,transparent);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:11px 22px;cursor:pointer;min-height:44px}
.pri{background:var(--green);color:#fff}.sec{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.pri[disabled]{opacity:.5}
.acq{background:color-mix(in srgb,var(--navy) 8%,transparent);border-right:4px solid var(--navy);padding:12px 14px;border-radius:6px}
canvas{width:100%;height:150px;border:1.5px dashed var(--navy);border-radius:8px;background:#fff;touch-action:none}
.rv{display:grid;grid-template-columns:1fr 1.4fr;gap:4px 12px;margin:0 0 14px}
.rv dt{color:var(--mut)}.rv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.rvh{margin:14px 0 4px;color:var(--navy);font-weight:800;border-bottom:1px solid var(--line)}
.imgs{display:flex;gap:10px;flex-wrap:wrap}.imgs img{height:110px;border-radius:8px;border:1px solid var(--line)}
.ok{text-align:center;padding:10px}.ok b{color:var(--green);font-size:1.3rem}
.note{font-size:.85rem;color:var(--mut);text-align:center;margin-top:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.rv{grid-template-columns:1fr 1fr}}
.pw{overflow-x:auto}.paper{min-width:640px;background:#fff;color:#000;font-size:14px;margin-bottom:14px;border:1px solid #999;padding:16px;color-scheme:light}
.paper *{color:#000}.pg{page-break-after:always}.pg:last-child{page-break-after:auto}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.lg{font-weight:800;color:#1d3a9e!important;font-size:1.15rem;line-height:1.3}.lg small{display:block;color:#2e9b4f!important;font-size:.8rem}
.pt{text-align:center;font-weight:800;font-size:1.05rem}
.ph .bx{width:105px;height:125px;border:1px solid #000;text-align:center;font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden}.bx img{width:100%;height:100%;object-fit:cover}
.row{display:flex;gap:12px;margin:8px 0}.r{display:flex;gap:5px;align-items:flex-end;min-width:0}.r b{white-space:nowrap;font-weight:700}.r i{font-style:normal;flex:1;border-bottom:1px dotted #000;min-height:1.5em;padding:0 5px;overflow-wrap:anywhere;font-size:1.25rem;font-weight:700;line-height:1.45}
.ids{display:flex;direction:ltr;margin:6px 0}.ids span{width:26px;height:30px;border:1px solid #000;text-align:center;line-height:28px;font-weight:800;font-size:1.15rem}
.sh{font-weight:800;font-size:1.1rem;margin:14px 0 4px}
.tz{width:100%;border-collapse:collapse;margin:6px 0}.tz td,.tz th{border:1px solid #000;padding:6px;height:30px;text-align:center}
.ft{border-top:2px solid #000;margin-top:14px;padding-top:4px;font-size:.72rem;font-weight:700}
.lgi{height:100px;width:auto}
#pa{display:none}.acard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin:16px auto;max-width:980px}
#adm{padding:0 12px}.tb{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tb input[type=text],.tb #q{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:600}
.tz2{width:100%;border-collapse:collapse;font-size:.92rem}.tz2 th,.tz2 td{border-bottom:1px solid var(--line);padding:8px;text-align:right;white-space:nowrap}.tz2 th{color:var(--mut)}.tz2 .ck{width:20px;min-height:20px}#adm .st{min-height:34px;font-size:.85rem}.s1{border-color:#e6a700!important}.s2{border-color:#2e9b4f!important}.s3{border-color:#c0392b!important}#adm select{min-height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}.tz2 button{min-height:34px;padding:0 10px;font-size:.85rem}
@media print{#adm{display:none!important}#pa{display:block}#pa .pw{page-break-after:always}#pa .pw:last-child{page-break-after:auto}}
@page{size:A4;margin:8mm}
@media print{header,.bar,.stepname,.nav,.noprint,.note{display:none!important}body{background:#fff}main{padding:0;max-width:none}.card{border:0;padding:0;background:#fff}.pw{overflow:visible}.paper{border:0;padding:0;margin:0;min-width:0;font-size:12.5px}.row{margin:5px 0}.sh{margin:8px 0 3px}.lgi{height:80px}.ph{margin-bottom:6px}.ph .bx{height:110px}.tz td,.tz th{height:24px;padding:3px}.paper .r i{font-size:1rem;line-height:1.25;min-height:1.3em}.paper .pg{page-break-after:auto}.row{gap:8px}.ids span{height:26px;line-height:24px}.paper p{margin:4px 0;line-height:1.6!important}.ft{margin-top:8px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<header><h1>حزب المؤتمر</h1><p>استمارة تعارف إلكترونية – معاً نبني</p></header>
<main>
<div class="bar" id="bar"></div>
<p class="stepname" id="sname"></p>
<div class="card" id="card"></div>
<p class="note noprint">بياناتك تُستخدم لإصدار استمارة التعارف فقط. سداد أي رسوم يكون بإيصالات رسمية صادرة عن الحزب.</p>
</main>
<div id="adm" style="display:none"></div><div id="pa"></div>
<script>
const GOV={"01":"القاهرة","02":"الإسكندرية","03":"بورسعيد","04":"السويس","11":"دمياط","12":"الدقهلية","13":"الشرقية","14":"القليوبية","15":"كفر الشيخ","16":"الغربية","17":"المنوفية","18":"البحيرة","19":"الإسماعيلية","21":"الجيزة","22":"بني سويف","23":"الفيوم","24":"المنيا","25":"أسيوط","26":"سوهاج","27":"قنا","28":"أسوان","29":"الأقصر","31":"البحر الأحمر","32":"الوادي الجديد","33":"مطروح","34":"شمال سيناء","35":"جنوب سيناء","88":"خارج الجمهورية"};
const GL=Object.values(GOV);
const CEN=["المنصورة","محلة دمنة","طلخا","نبروه","بلقاس","شربين","دكرنس","بني عبيد","منية النصر","ميت سلسيل","الجمالية","المنزلة","المطرية","السنبلاوين","تمي الأمديد","أجا","ميت غمر"];
const T=(id,l,o={})=>({id,l,t:"text",...o});
const S=(id,l,opts,o={})=>({id,l,t:"sel",opts,...o});
const D=(id,l,o={})=>({id,l,t:"date",...o});
const Y=(id,l,dl,o={})=>({id,l,t:"yn",dl,...o});
const STEPS=[
{n:"البيانات الأساسية",f:[
 S("gov","المحافظة",GL,{req:1,def:"الدقهلية"}),T("center","القسم / المركز",{req:1,list:1}),T("unit","الوحدة الأساسية"),
 T("name","الاسم رباعي",{req:1,full:1}),T("fame","اسم الشهرة"),
 T("nid","الرقم القومي (14 رقماً)",{req:1,nid:1,inp:"numeric",max:14}),
 D("bd","تاريخ الميلاد",{ro:1}),T("bp","جهة الميلاد (محافظة)",{ro:1}),
 S("sex","النوع",["ذكر","أنثى"],{req:1}),S("rel","الديانة",["مسلم","مسيحي"],{req:1}),
 S("mar","الحالة الاجتماعية",["أعزب","متزوج","أخرى"],{req:1}),
 {id:"photo",l:"صورة شخصية",t:"file",req:1},{id:"idimg",l:"صورة بطاقة الرقم القومي (الوجه)",t:"file",req:1},{id:"idback",l:"صورة بطاقة الرقم القومي (الظهر)",t:"file",req:1}]},
{n:"البطاقة والعنوان",f:[
 D("issue","تاريخ إصدار البطاقة",{req:1}),
 S("mil","الموقف من التجنيد",["أدّى","مؤجل","معاف مؤقتاً","معاف نهائياً","لا ينطبق"],{req:1}),
 T("flat","شقة رقم"),T("house","منزل رقم"),T("street","الشارع",{full:1}),
 T("vil","الشياخة / القرية"),T("city","المدينة / الحي"),
 T("land","تليفون أرضي",{inp:"tel"}),T("mob","تليفون محمول",{req:1,inp:"tel",mob:1,max:11}),
 T("mail","البريد الإلكتروني",{full:1,inp:"email"})]},
{n:"العمل والتعليم",f:[
 S("sector","الوظيفة الحالية",["حكومة","قطاع عام","قطاع خاص","أعمال حرة","لا أعمل"],{req:1}),
 T("job","المسمى الوظيفي"),T("waddr","عنوان العمل",{full:1}),
 T("qual","آخر مؤهل دراسي",{req:1}),T("qsrc","جهة الحصول عليه"),T("qyear","سنة الحصول عليه",{inp:"numeric",max:4}),
 T("univ","للطالب: الكلية أو المعهد"),T("uniN","الجامعة"),
 T("evil","الموطن الانتخابي: قرية / حي / شياخة"),T("egov","محافظة الموطن الانتخابي")]},
{n:"النشاط السياسي والعام",f:[
 Y("py1","هل كنت عضواً في إحدى المجالس النيابية؟","حدد المجلس والدورة"),
 Y("py2","هل كنت عضواً في إحدى المجالس الشعبية المحلية؟","المحافظة / المركز / الدورة"),
 Y("py3","هل رشحت نفسك في الانتخابات البرلمانية؟","المحافظة / الدائرة / الدورة"),
 Y("py4","هل سبق لك الانضمام لأي حزب سياسي؟","اسم الحزب"),
 Y("py5","هل أنت مشترك في إحدى الجمعيات الأهلية؟","اسم الجمعية ونشاطها"),
 Y("py6","هل أنت عضو في نادي / مركز شباب؟","الاسم وطبيعة الاشتراك (عضو / عضو مجلس إدارة / رئيس مجلس)")]},
{n:"النشاط النقابي والمهني",f:[
 Y("u1","هل أنت مشترك في إحدى النقابات؟","اسم النقابة، رقم القيد، تاريخ القيد، والصفة النقابية"),
 Y("u2","هل أنت مشترك في إحدى الجمعيات الزراعية؟","اسم الجمعية، نشاطها، المحافظة والقرية")]},
{n:"الإقرار والتوقيع",f:[{t:"ack"}]},
{n:"المراجعة والتأكيد",f:[{t:"review"}]}
];
const V={},FILES={};let cur=0,done=false,sig=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fld(f){
 const v=V[f.id]??f.def??"";if(f.def&&V[f.id]==null)V[f.id]=f.def;
 const cls="f"+(f.full?" full":"");let h="";
 if(f.t==="yn"){
  const a=V[f.id];
  return `<div class="f full"><label>${f.l}</label><div class="yn"><label><input type="radio" name="${f.id}" value="نعم" ${a==="نعم"?"checked":""}> نعم</label><label><input type="radio" name="${f.id}" value="لا" ${a==="لا"?"checked":""}> لا</label></div>${a==="نعم"?`<input data-id="${f.id}d" placeholder="${f.dl}" value="${esc(V[f.id+"d"])}">`:""}</div>`;}
 if(f.t==="sel")h=`<select data-id="${f.id}"><option value="">اختر…</option>${f.opts.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("")}</select>`;
 else if(f.t==="file")h=`<input type="file" accept="image/*" data-file="${f.id}">${FILES[f.id]?`<img src="${FILES[f.id]}" alt="" style="height:70px;border-radius:6px;margin-top:4px">`:""}`;
 else h=`<input type="${f.t==="date"?"date":"text"}" data-id="${f.id}" value="${esc(v)}" ${f.ro?"readonly":""} ${f.inp?`inputmode="${f.inp}"`:""} ${f.max?`maxlength="${f.max}"`:""} ${f.list?'list="cl"':""}>`;
 return `<div class="${cls}"><label>${f.l}${f.req?" *":""}</label>${h}<div class="msg" id="m_${f.id}"></div>${f.nid?'<div class="hint">يُستخرج منه تاريخ الميلاد والنوع ومحافظة الميلاد تلقائياً</div>':""}</div>`;
}
function render(){
 $("#bar").innerHTML=STEPS.map((_,i)=>`<i class="${i<=cur?"on":""}"></i>`).join("");
 $("#sname").textContent=`الخطوة ${cur+1} من ${STEPS.length}`;
 const st=STEPS[cur];let h=`<h2>${st.n}</h2>`;
 if(done){h=`<div class="ok noprint"><b>تم إرسال طلبك بنجاح</b><p>اطبع الاستمارة أو احفظها PDF ووقّعها وسلّمها لأمانة العضوية مع صورة البطاقة.</p></div>`+paper()+`<div class="nav noprint"><button class="sec" onclick="location.reload()">تسجيل عضو جديد</button><button class="pri" onclick="window.print()">طباعة / حفظ PDF</button></div>`;$("#card").innerHTML=h;return;}
 const f0=st.f[0];
 if(f0.t==="ack")h+=`<p class="acq">أقر بأنني قد اطلعت على برنامج الحزب كاملاً، وأنني موافق على كل ما جاء به. معلناً التزامي الكامل بمبادئ الحزب وأهدافه، وأنني ملتزم بكل ما جاء بلائحة الحزب الأساسي، وأن جميع بياناتي المذكورة صحيحة وعلى مسئوليتي.</p><div class="f" style="margin-top:12px"><label>توقيع العضو (بالإصبع أو الماوس) *</label><canvas id="sg" tabindex="0" aria-label="مساحة التوقيع"></canvas><div class="msg" id="m_sig"></div><div><button class="sec" onclick="clr()">مسح التوقيع</button></div></div>`;
 else if(f0.t==="review")h+=review()+`<div class="msg" id="m_all"></div>`;
 else h+=`<div class="grid">${st.f.map(fld).join("")}</div><datalist id="cl">${CEN.map(c=>`<option>${c}</option>`).join("")}</datalist>`;
 h+=`<div class="nav noprint"><button class="sec" ${cur?"":"disabled"} onclick="go(-1)">السابق</button><button class="pri" onclick="go(1)">${cur===STEPS.length-1?"تأكيد وإرسال الطلب":"التالي"}</button></div>`;
 $("#card").innerHTML=h;bind();if($("#sg"))initSig();
 window.scrollTo(0,0);
}
function bind(){
 document.querySelectorAll("[data-id]").forEach(e=>e.addEventListener("input",()=>{V[e.dataset.id]=e.value;e.classList.remove("bad");if(e.dataset.id==="nid")nid(e.value);}));
 document.querySelectorAll("[data-id]").forEach(e=>e.addEventListener("change",()=>V[e.dataset.id]=e.value));
 document.querySelectorAll(".yn input").forEach(e=>e.addEventListener("change",()=>{V[e.name]=e.value;render();}));
 document.querySelectorAll("[data-file]").forEach(e=>e.addEventListener("change",()=>{const f=e.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);FILES[e.dataset.file]=c.toDataURL("image/jpeg",.8);render();};im.src=r.result;};r.readAsDataURL(f);}));
}
function nid(v){
 const bd=$("[data-id=bd]"),bp=$("[data-id=bp]"),sx=$("[data-id=sex]");
 if(/^[23]\d{13}$/.test(v)){
  const c=v[0]==="2"?1900:2000,y=c+ +v.slice(1,3),m=v.slice(3,5),d=v.slice(5,7);
  const iso=`${y}-${m}-${d}`,dt=new Date(iso);
  if(dt.getMonth()+1==+m&&dt.getDate()==+d){V.bd=iso;bd.value=iso;}
  V.bp=GOV[v.slice(7,9)]||"";bp.value=V.bp;
  V.sex=(+v[12])%2?"ذكر":"أنثى";sx.value=V.sex;
 }
}
function err(id,t){const m=$("#m_"+id),e=$("[data-id="+id+"]");if(m)m.textContent=t;if(e)e.classList.add("bad");}
function check(i){
 let ok=true;const st=STEPS[i];
 if(st.f[0].t==="ack"){if(!sig){$("#m_sig").textContent="يرجى التوقيع داخل المربع.";return false;}return true;}
 if(st.f[0].t==="review")return true;
 st.f.forEach(f=>{
  const m=$("#m_"+f.id);if(m)m.textContent="";
  if(f.t==="file"){if(f.req&&!FILES[f.id]){m&&0;ok=false;alert("يرجى رفع: "+f.l);}return;}
  if(f.t==="yn"){return;}
  const v=(V[f.id]||"").trim();
  if(f.req&&!v){err(f.id,"هذه الخانة مطلوبة.");ok=false;return;}
  if(f.nid&&!/^[23]\d{13}$/.test(v)){err(f.id,"الرقم القومي يجب أن يكون 14 رقماً ويبدأ بـ 2 أو 3.");ok=false;}
  if(f.mob&&!/^01[0125]\d{8}$/.test(v)){err(f.id,"اكتب رقم محمول مصري صحيح من 11 رقماً.");ok=false;}
  if(f.id==="mail"&&v&&!/^\S+@\S+\.\S+$/.test(v)){err(f.id,"البريد الإلكتروني غير صحيح.");ok=false;}
 });
 st.f.forEach(f=>{if(f.t==="yn"&&!V[f.id]){ok=false;}});
 if(st.f.some(f=>f.t==="yn")&&!ok&&!document.querySelector(".bad"))alert("يرجى الإجابة عن جميع الأسئلة بنعم أو لا.");
 return ok;
}
function go(d){
 if(d>0&&!check(cur))return;
 if(d>0&&cur===STEPS.length-1){sendNow();return;}
 cur=Math.max(0,cur+d);render();
}
function review(){
 let h="";
 STEPS.forEach(s=>{
  const rows=s.f.filter(f=>f.id&&f.t!=="file").map(f=>{
   let v=V[f.id];if(f.t==="yn"&&v==="نعم"&&V[f.id+"d"])v+=" – "+V[f.id+"d"];
   return v?`<dt>${f.l.replace(/\?|؟/,"")}</dt><dd>${esc(v)}</dd>`:"";}).join("");
  if(rows)h+=`<div class="rvh">${s.n}</div><dl class="rv">${rows}</dl>`;
 });

let cv,cx;
function initSig(){
 cv=$("#sg");const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;
 cx=cv.getContext("2d");cx.scale(2,2);cx.lineWidth=2.2;cx.lineCap="round";cx.strokeStyle="#1d3a9e";
 if(FILES.sig){const i=new Image();i.onload=()=>cx.drawImage(i,0,0,r.width,r.height);i.src=FILES.sig;}
 let dr=false;
 const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
 cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);const[x,y]=p(e);cx.beginPath();cx.moveTo(x,y);};
 cv.onpointermove=e=>{if(!dr)return;const[x,y]=p(e);cx.lineTo(x,y);cx.stroke();};
 cv.onpointerup=()=>{if(!dr)return;dr=false;sig=true;FILES.sig=cv.toDataURL();$("#m_sig").textContent="";};
}
function clr(){cx.clearRect(0,0,cv.width,cv.height);sig=false;delete FILES.sig;}

const shrink=(u,w,q)=>new Promise(r=>{if(!u)return r("");const i=new Image();i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",q));};i.src=u;});

const sel=id=>id?[id]:[...document.querySelectorAll(".ck:checked")].map(c=>c.value);
async function setSt(id,v){const r=REC.find(x=>x.id===id);try{const j=await post({action:"update",key:KEY,nid:id,st:v});if(!j.ok)throw 0;r.st=v;$("#as").textContent="تم تحديث الحالة";list();}catch(e){$("#as").textContent="تعذر حفظ الحالة (حدّث السكربت).";list();}}
async function note(id){const r=REC.find(x=>x.id===id);const v=prompt("ملاحظة داخلية (لا تظهر في الاستمارة):",r.note||"");if(v===null)return;
  try{const j=await post({action:"update",key:KEY,nid:id,note:v});if(!j.ok)throw 0;r.note=v;list();}catch(e){$("#as").textContent="تعذر حفظ الملاحظة.";}}
async function mv(a,id){const ids=sel(id);if(!ids.length){$("#as").textContent="حدد طلباً واحداً على الأقل.";return;}
  if(a==="trash"&&!confirm("نقل "+ids.length+" طلب للسلة؟ تقدر ترجّعهم بعدين."))return;
  $("#as").textContent="جاري التنفيذ…";
  try{const j=await post({action:a,key:KEY,ids});if(!j.ok)throw 0;REC.forEach(r=>{if(ids.includes(r.id))r.del=a==="trash"?new Date().toISOString():"";});list();$("#as").textContent=a==="trash"?"اتنقل "+ids.length+" للسلة.":"تم الاسترجاع.";}
  catch(e){$("#as").textContent="تعذر التنفيذ (تأكد من تحديث السكربت).";}}
async function purge(id){const ids=sel(id);if(!ids.length){$("#as").textContent="حدد طلباً واحداً على الأقل.";return;}
  if(!confirm("حذف نهائي لـ "+ids.length+" طلب مع صورهم؟ لا يمكن التراجع."))return;
  try{const j=await post({action:"delete",key:KEY,ids});if(!j.ok)throw 0;REC=REC.filter(r=>!ids.includes(r.id));list();$("#as").textContent="تم الحذف النهائي.";}
  catch(e){$("#as").textContent="تعذر الحذف.";}}
async function bk(){$("#as").textContent="جاري عمل نسخة…";try{const j=await post({action:"backup",key:KEY});if(!j.ok)throw 0;$("#as").textContent="تم: "+j.name+" (في Drive ← نسخ احتياطية - تعارف)";}catch(e){$("#as").textContent="تعذر عمل النسخة.";}}
async function pwd(){const a=prompt("اكتب الرقم السري الجديد (6 أحرف على الأقل):");if(a===null)return;if(a.length<6){alert("قصير جداً.");return;}
  if(prompt("أعد كتابته للتأكيد:")!==a){alert("مش متطابق.");return;}
  try{const j=await post({action:"setkey",key:KEY,newKey:a});if(!j.ok)throw 0;KEY=a;$("#as").textContent="تم تغيير الرقم السري.";}catch(e){$("#as").textContent="تعذر التغيير.";}}
function stats(){const R=REC.filter(r=>!r.del),day=r=>(r.at||"").slice(0,10),today=new Date().toISOString().slice(0,10);
  const cnt=(f)=>{const m={};R.forEach(r=>{const k=f(r)||"غير محدد";m[k]=(m[k]||0)+1;});return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const bars=(arr,n)=>{const mx=Math.max(1,...arr.map(x=>x[1]));return arr.slice(0,n).map(([k,v])=>`<div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><div style="background:var(--navy);height:14px;border-radius:3px;width:${Math.round(v/mx*100)}%;min-width:3px"></div><b>${v}</b></div>`).join("");};
  const wk=R.filter(r=>(Date.now()-new Date(r.at||0))<7*864e5).length;
  const days=[];for(let i=13;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);days.push([d.slice(5),R.filter(r=>day(r)===d).length]);}
  $("#dv").innerHTML=`<div class="acard"><div class="tb"><button class="sec" onclick="$('#dv').innerHTML=''">إغلاق</button></div><h3>إحصائيات</h3>
  <p>الإجمالي: <b>${R.length}</b> · اليوم: <b>${R.filter(r=>day(r)===today).length}</b> · آخر 7 أيام: <b>${wk}</b></p>
  <h4>حسب الحالة</h4>${bars(cnt(r=>r.st||"جديد"),4)}<h4>حسب القسم / المركز</h4>${bars(cnt(r=>r.V.center),10)}<h4>حسب المحافظة</h4>${bars(cnt(r=>r.V.gov),10)}<h4>آخر 14 يوم</h4>${bars(days,14)}</div>`;
  $("#dv").scrollIntoView({behavior:"smooth"});}
async function view(id){$("#as").textContent="جاري التحميل…";
  try{const j=await post({action:"get",key:KEY,nid:id});if(!j.ok)throw 0;const kv={...V},kf={...FILES};wipe();Object.assign(V,j.V);Object.assign(FILES,j.F||{});sig=!!FILES.sig;const h=review();wipe();Object.assign(V,kv);Object.assign(FILES,kf);
   $("#dv").innerHTML='<div class="acard"><div class="tb"><button class="sec" onclick="$(\'#dv\').innerHTML=\'\'">إغلاق</button></div>'+h+'</div>';$("#as").textContent="";$("#dv").scrollIntoView({behavior:"smooth"});}
  catch(e){$("#as").textContent="تعذر فتح الطلب.";}}
function xl(){if(!REC.filter(r=>!r.del).length){$("#as").textContent="لا توجد طلبات للتصدير.";return;}
 const fs=STEPS.flatMap(x=>x.f).filter(f=>f.id&&f.t!=="file");
 const rows=REC.filter(r=>!r.del).map((r,i)=>{const o={"م":String(i+1)};fs.forEach(f=>{let v=r.V[f.id]??"";if(f.t==="yn"&&v==="نعم"&&r.V[f.id+"d"])v+=" – "+r.V[f.id+"d"];o[f.l]=String(v);});o["الحالة"]=r.st||"جديد";o["ملاحظات"]=r.note||"";o["تاريخ الإرسال"]=(r.at||"").slice(0,10);return o;});
 const ws=XLSX.utils.json_to_sheet(rows);ws["!cols"]=Object.keys(rows[0]).map(()=>({wch:22}));
 const wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};XLSX.utils.book_append_sheet(wb,ws,"الطلبات");XLSX.writeFile(wb,"membership-requests.xlsx");}
async function prt(id){const ids=id?[id]:[...document.querySelectorAll(".ck:checked")].map(c=>c.value);
 if(!ids.length){$("#as").textContent="حدد طلباً واحداً على الأقل.";return;}
 $("#as").textContent="جاري تجهيز الطباعة…";const kv={...V},kf={...FILES};let html="";
 try{for(const n of ids){const j=await post({action:"get",key:KEY,nid:n});if(!j.ok)throw 0;wipe();Object.assign(V,j.V);Object.assign(FILES,j.F||{});html+=paper();}}
 catch(e){wipe();Object.assign(V,kv);Object.assign(FILES,kf);$("#as").textContent="تعذر تجهيز الطباعة.";return;}
 wipe();Object.assign(V,kv);Object.assign(FILES,kf);$("#pa").innerHTML=html;$("#as").textContent="";setTimeout(()=>window.print(),300);}
if(location.hash==="#admin")initAdmin();else render();
addEventListener("hashchange",()=>location.reload());
</script>
